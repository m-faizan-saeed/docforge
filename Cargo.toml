[workspace]
resolver = "3"
members = ["crates/docforge-core", "crates/docforge-nodes", "crates/docforge-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ab_glyph = "0.2.32"
docforge-core = { path = "crates/docforge-core" }
docforge-nodes = { path = "crates/docforge-nodes" }
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false }
lopdf = { version = "0.46.0", default-features = false }
png = "0.18.1"
rayon = "1.12"
epaint_default_fonts = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Image codecs are unbearably slow without optimisation; keep our own crates
# fast to compile but always optimise dependencies.
[profile.dev.package."*"]
opt-level = 3

# The web build (used by trunk, see crates/docforge-app/index.html): smaller
# download. Desktop builds keep the standard release profile.
[profile.web-release]
inherits = "release"
lto = true
codegen-units = 1
strip = true
panic = "abort"
