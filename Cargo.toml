[workspace]
resolver = "3"
members = ["crates/docforge-core", "crates/docforge-nodes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
docforge-core = { path = "crates/docforge-core" }
image = { version = "0.25.10", default-features = false }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Image codecs are unbearably slow without optimisation; keep our own crates
# fast to compile but always optimise dependencies.
[profile.dev.package."*"]
opt-level = 3
