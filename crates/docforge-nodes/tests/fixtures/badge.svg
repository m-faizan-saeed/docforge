<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148">
  <!-- full-page white background, as design tools often export -->
  <rect x="0" y="0" width="210" height="148" fill="#ffffff"/>
  <defs><clipPath id="c"><circle cx="150" cy="70" r="22"/></clipPath></defs>
  <g transform="translate(40 30) rotate(-8)">
    <rect x="0" y="0" width="80" height="50" rx="8" fill="#2b6cb0" stroke="#1a365d" stroke-width="3"/>
    <path d="M 10 45 C 25 5, 55 5, 70 45" fill="none" stroke="#f6e05e" stroke-width="4"/>
    <text x="12" y="30" font-family="DejaVu Sans" font-size="11" fill="#ffffff">VISITOR</text>
  </g>
  <!-- big square clipped to a circle: only the circle may count -->
  <rect x="100" y="20" width="100" height="100" fill="#c53030" clip-path="url(#c)"/>
  <text x="128" y="112" font-family="DejaVu Sans" font-size="9" fill="#222">No. 0042</text>
</svg>
