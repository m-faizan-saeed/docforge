[package]
name = "docforge-app"
description = "Desktop node editor for docforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "docforge"
path = "src/main.rs"

[dependencies]
docforge-core.workspace = true
docforge-nodes.workspace = true
eframe = "0.37"
hayro.workspace = true
serde_json.workspace = true
# std::time::Instant on desktop; the browser's clock on the web.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Desktop takes symbols (⏶ 🗑 💾 …) from system fonts; a web page has none,
# so it bundles egui's emoji fonts instead.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "ImageData",
    "Location",
    "Response",
    "Url",
    "UrlSearchParams",
    "Window",
] }
